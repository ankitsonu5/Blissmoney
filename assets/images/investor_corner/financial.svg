<svg width="250" height="250" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .dot-diag {
    animation: slideDiag 4s ease-in-out infinite alternate;
    will-change: transform;
    filter: drop-shadow(0 0 6px rgba(9, 213, 159, 0.9));
  }
  @keyframes slideDiag {
    0% {
      transform: translate(-55px, 55px);
    }
    100% {
      transform: translate(110px, -110px);
    }
  }
</style>
<rect width="250" height="250" fill="#0C1917"/>

<!-- Outer Square Frame -->
<rect x="10" y="10" width="230" height="230" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Diagonal Line from Bottom-Left to Top-Right -->
<line x1="10" y1="240" x2="240" y2="10" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Small Circle (Bottom-Left) Tangent to Left Wall, Bottom Wall, and Diagonal -->
<circle cx="58.5" cy="191.5" r="48.5" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Large Circle (Top-Right) Tangent to Top Wall, Right Wall, and Small Circle -->
<circle cx="153.8" cy="96.2" r="86.2" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Animated Dot sliding along the Diagonal through Tangent Point (92.8, 157.2) -->
<circle class="dot-diag" cx="92.8" cy="157.2" r="7.7" fill="#09D59F"/>
</svg>