<svg width="250" height="250" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .dot-orbit-mortgage {
    transform-origin: 0 0;
    animation: orbitMortgage 7s linear infinite;
    will-change: transform;
  }
  .dot-orbit-mortgage circle {
    filter: drop-shadow(0 0 6px rgba(9, 213, 159, 0.9));
  }
  @keyframes orbitMortgage {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
<rect width="250" height="250" fill="#0C1917"/>

<!-- Outer Square Frame -->
<rect x="10" y="10" width="230" height="230" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Outer Circle Inscribed in Square (tangent to all 4 walls) -->
<circle cx="125" cy="125" r="115" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Inner Concentric Circle (half radius of outer circle) -->
<circle cx="125" cy="125" r="57.5" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Diagonal Line from Bottom-Left Corner through Center to Top-Right Perimeter of Inner Circle -->
<line x1="10" y1="240" x2="165.66" y2="84.34" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Orbiting Dot orbiting continuously around inner circle -->
<g transform="translate(125, 125)">
  <g class="dot-orbit-mortgage">
    <circle cx="40.66" cy="-40.66" r="7.7" fill="#09D59F"/>
  </g>
</g>
</svg>