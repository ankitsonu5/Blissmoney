<svg width="250" height="250" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .dot-orbit-risk {
    transform-origin: 0 0;
    animation: orbitRisk 8s linear infinite;
    will-change: transform;
  }
  .dot-orbit-risk circle {
    filter: drop-shadow(0 0 6px rgba(9, 213, 159, 0.9));
  }
  @keyframes orbitRisk {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
<rect width="250" height="250" fill="#0C1917"/>

<!-- Outer Square Frame -->
<rect x="10" y="10" width="230" height="230" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Central Circle -->
<circle cx="125" cy="125" r="67.5" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- 4 Crosshair Ticks -->
<!-- Top Tick -->
<line x1="125" y1="57.5" x2="125" y2="35" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>
<!-- Bottom Tick -->
<line x1="125" y1="192.5" x2="125" y2="215" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>
<!-- Left Tick -->
<line x1="57.5" y1="125" x2="35" y2="125" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>
<!-- Right Tick -->
<line x1="192.5" y1="125" x2="215" y2="125" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Diagonal Segments -->
<!-- Top-right corner to circle perimeter -->
<line x1="240" y1="10" x2="172.7" y2="77.3" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>
<!-- Bottom-left corner to center -->
<line x1="10" y1="240" x2="125" y2="125" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Orbiting Dot orbiting continuously around circle perimeter -->
<g transform="translate(125, 125)">
  <g class="dot-orbit-risk">
    <circle cx="-47.7" cy="-47.7" r="7.7" fill="#09D59F"/>
  </g>
</g>
</svg>