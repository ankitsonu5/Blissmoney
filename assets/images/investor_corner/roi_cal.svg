<svg width="250" height="250" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .dot-start {
    animation: moveStart 3.2s ease-in-out infinite alternate;
    will-change: transform;
    filter: drop-shadow(0 0 6px rgba(9, 213, 159, 0.9));
  }
  .dot-end {
    animation: moveEnd 3.2s ease-in-out infinite alternate;
    will-change: transform;
    filter: drop-shadow(0 0 6px rgba(9, 213, 159, 0.9));
  }
  @keyframes moveStart {
    0% {
      transform: translate(0px, 0px);
    }
    100% {
      transform: translate(50.3px, -50.3px);
    }
  }
  @keyframes moveEnd {
    0% {
      transform: translate(0px, 0px);
    }
    100% {
      transform: translate(-50.3px, 50.3px);
    }
  }
</style>
<rect width="250" height="250" fill="#0C1917"/>

<!-- Outer Square Frame -->
<rect x="10" y="10" width="230" height="230" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Small Circle (Bottom-Left) -->
<circle cx="52" cy="198" r="38.2" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Large Circle (Top-Right) -->
<circle cx="163.5" cy="86.5" r="72.8" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Diagonal Line Segment extending through the circles -->
<line x1="40" y1="210" x2="176" y2="74" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.2"/>

<!-- Starting Dot (Small Circle) and Ending Dot (Large Circle) - Both moving towards each other and touching -->
<circle class="dot-start" cx="52" cy="198" r="7.7" fill="#09D59F"/>
<circle class="dot-end" cx="163.5" cy="86.5" r="7.7" fill="#09D59F"/>
</svg>